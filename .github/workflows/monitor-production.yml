name: Production health monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify API freshness
        shell: bash
        run: |
          body=$(curl --fail --retry 3 --max-time 20 https://rail-ukraine-pulse-api.hitchhermano.workers.dev/api/health)
          node -e 'const h=JSON.parse(process.argv[1]);const failed=[];if(h.status!=="ok"||h.snapshot.ageMinutes>20)failed.push(`snapshot ${h.status}, age=${h.snapshot.ageMinutes}`);if(h.storageBackup?.status!=="online")failed.push(`backup ${h.storageBackup?.status||"missing"}, RPO=${h.storageBackup?.actualRpoHours??"?"}h`);if(h.storageBackup?.restoreStatus!=="verified")failed.push(`restore ${h.storageBackup?.restoreStatus||"missing"}`);if(failed.length)throw new Error(`SLO violation: ${failed.join("; ")}`)' "$body"

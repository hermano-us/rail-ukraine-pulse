name: Update OSM rail graph

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-osm-rail-graph.mjs"
      - "scripts/build-rail-graph.mjs"
      - "scripts/lib/rail-graph-builder.mjs"
      - ".github/workflows/update-rail-graph.yml"
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-osm-rail-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/rail-osm
          key: rail-osm-relations-v3-${{ github.run_id }}
          restore-keys: rail-osm-relations-v3-
      - run: npm ci
      - name: Fetch complete physical graph and route relations
        run: npm run update-rail-graph
      - name: Validate routing and migration
        run: node --test tests/rail-graph-reference.test.mjs tests/rail-intelligence-automation.test.mjs tests/backend-migration.test.mjs
      - name: Publish validated reference snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/rail-reference; then
            echo "Rail reference is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rail-reference
          git commit -m "Update validated OSM rail graph"
          git push
